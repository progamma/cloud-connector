name: Installer

# Builds one installer per platform.
#
# Each one is built on the platform it is for, and that is not a convenience: the connector's
# modules are not all Javascript. `odbc` and `@node-rs/crc32` resolve to a binary chosen by the
# platform and the architecture npm runs on, so a payload assembled on Linux for Windows would
# carry the wrong binary or none at all, and nothing would say so until somebody tried to open an
# ODBC datamodel.
#
# Run it by hand from the Actions tab, or let a published release run it: in that case the
# installers are attached to the release as they are built.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not take the others down: three signed installers and a
      # message about the fourth is a better day than nothing at all
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: cc-installer-win-x64
            file: cc-installer.exe
          - os: ubuntu-latest
            label: Linux x64
            artifact: cc-installer-linux-x64
            file: cc-installer
          - os: macos-13
            label: macOS x64
            artifact: cc-installer-darwin-x64
            file: cc-installer
          - os: macos-14
            label: macOS arm64
            artifact: cc-installer-darwin-arm64
            file: cc-installer

    steps:
      - name: Check out
        uses: actions/checkout@v4
        # The build asks git which files belong to the connector, so a shallow checkout of the
        # tree alone would not do

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `odbc` installs with `node-pre-gyp install --fallback-to-build`. IBM publishes a binary
      # for every platform in the matrix above, so normally nothing is compiled and none of this
      # is needed. The fallback is silent, though: if a download fails, npm quietly starts
      # compiling and stops on a missing header, several screens away from the real cause. This
      # is here so that the second path works too — and it is the only path on any architecture
      # IBM does not publish a binary for, linux-arm64 among them.
      - name: Make it possible to compile odbc, in case the prebuilt one cannot be fetched
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev

      - name: Make it possible to compile odbc, in case the prebuilt one cannot be fetched
        if: runner.os == 'macOS'
        run: brew install unixodbc

      - name: Install the build's own modules
        working-directory: installer
        run: npm ci

      - name: Build
        working-directory: installer
        run: node build/build.js

      # --- signing -----------------------------------------------------------------------
      # The certificates exist; the secret names below are what this workflow expects to find
      # them under. Each step stands aside when its secret is not there, so that a build can be
      # run before the secrets are in place and produce an unsigned installer rather than an
      # error. An unsigned one is fine to test with and must not be published.

      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 installer/build/out/${{ matrix.file }}
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx
          # A timestamp is what keeps the signature valid after the certificate expires: without
          # one, every installer already downloaded stops being trusted on the day it lapses

      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && env.CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p actions "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
          security list-keychain -d user -s "$keychain"
          # The runtime the installer is made of writes files and runs programs, so the hardened
          # runtime is on and the entitlements say what it is allowed to do
          codesign --force --timestamp --options runtime \
            --entitlements installer/build/entitlements.plist \
            --sign "$IDENTITY" "installer/build/out/${{ matrix.file }}"
          codesign --verify --strict --verbose=2 "installer/build/out/${{ matrix.file }}"
          # Notarisation works on an archive, not on a bare executable
          ditto -c -k --keepParent "installer/build/out/${{ matrix.file }}" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM" --wait
          # A bare executable cannot be stapled: Gatekeeper checks it against Apple online. What
          # is stapled is the disk image, if one is ever published
          security delete-keychain "$keychain"
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Say whether it was signed
        shell: bash
        run: |
          cd installer/build/out
          ls -la ${{ matrix.file }}
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --display --verbose=2 ${{ matrix.file }} 2>&1 | grep -i "authority\|adhoc" || echo "UNSIGNED"
          fi

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer/build/out/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach it to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd installer/build/out
          # Named after the platform, because a release page with four files called cc-installer
          # is a release page nobody can download from
          name="${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          mv "${{ matrix.file }}" "$name"
          gh release upload "${{ github.event.release.tag_name }}" "$name" --clobber \
            --repo "${{ github.repository }}"
